name: Build FormantFlex

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: FormantFlex-Windows-VST3
          path: build/FormantFlex_artefacts/Release/VST3/
